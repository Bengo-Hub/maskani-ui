name: Build and Deploy Maskani UI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deployment secrets live in devops-k8s and are synced here on demand by name.
# GH_PAT must exist in this repo to trigger the cross-repo sync workflow.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next.config sets ignoreBuildErrors, so types are checked here explicitly.
      - run: pnpm type-check

  sync-secrets:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.sync.outputs.result }}
    steps:
      - name: Check and sync missing secrets
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          _REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          _REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          _REGISTRY_EMAIL: ${{ secrets.REGISTRY_EMAIL }}
          _KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          REQUIRED_SECRETS="REGISTRY_USERNAME REGISTRY_PASSWORD REGISTRY_EMAIL KUBE_CONFIG"
          EXISTING=$(gh secret list --repo "${{ github.repository }}" --json name -q '.[].name' 2>/dev/null || echo "")
          for secret in $REQUIRED_SECRETS; do
            env_var="_${secret}"
            if echo "$EXISTING" | grep -qx "$secret" && [ -z "${!env_var}" ]; then
              gh secret delete "$secret" --repo "${{ github.repository }}" 2>/dev/null || true
            fi
          done
          EXISTING=$(gh secret list --repo "${{ github.repository }}" --json name -q '.[].name' 2>/dev/null || echo "")
          MISSING=()
          for secret in $REQUIRED_SECRETS; do
            echo "$EXISTING" | grep -qx "$secret" || MISSING+=("$secret")
          done
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Syncing: ${MISSING[*]}"
          gh workflow run sync-secrets.yml --repo Bengo-Hub/devops-k8s --ref main \
            -f target_repo="${{ github.repository }}" -f secrets="${MISSING[*]}"
          for i in $(seq 1 18); do
            sleep 10
            CURRENT=$(gh secret list --repo "${{ github.repository }}" --json name -q '.[].name' 2>/dev/null || echo "")
            STILL=0
            for secret in "${MISSING[@]}"; do echo "$CURRENT" | grep -qx "$secret" || STILL=$((STILL + 1)); done
            if [ $STILL -eq 0 ]; then echo "result=synced" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "result=partial" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Re-trigger if secrets were just synced
        if: needs.sync-secrets.outputs.result == 'synced'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref "${{ github.ref }}"

      - name: Abort if sync was partial
        if: needs.sync-secrets.outputs.result == 'partial'
        run: |
          echo "Secret sync timed out"
          exit 1

      - uses: actions/checkout@v4
        if: needs.sync-secrets.outputs.result == 'skipped'

      - uses: docker/setup-buildx-action@v3
        if: needs.sync-secrets.outputs.result == 'skipped'

      - name: Install DevOps tools
        if: needs.sync-secrets.outputs.result == 'skipped'
        uses: Bengo-Hub/devops-k8s/.github/actions/install-devops-tools@main

      - name: Build, push and bump the image tag
        if: needs.sync-secrets.outputs.result == 'skipped'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY: true
          NAMESPACE: maskani
          APP_NAME: maskani-ui
          REGISTRY_SERVER: docker.io
          REGISTRY_NAMESPACE: codevertex
          GIT_USER: "Maskani UI Bot"
          GIT_EMAIL: "dev@bengobox.com"
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Tag and push latest
        if: success() && needs.sync-secrets.outputs.result == 'skipped'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          IMAGE_REPO="docker.io/codevertex/maskani-ui"
          SHORT_SHA=${GITHUB_SHA::8}
          echo "$REGISTRY_PASSWORD" | docker login docker.io -u "$REGISTRY_USERNAME" --password-stdin
          docker tag "${IMAGE_REPO}:${SHORT_SHA}" "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:latest"

      - name: Refresh the ArgoCD application
        if: success() && needs.sync-secrets.outputs.result == 'skipped'
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          [ -z "${KUBE_CONFIG_B64}" ] && exit 0
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          kubectl patch application maskani-ui -n argocd --type merge \
            -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}' || true
